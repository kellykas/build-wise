    <rect x="17" y="19" width="3" height="4" fill="#1A1A1A" opacity="0.5"/>
    <rect x="21" y="19" width="3" height="4" fill="#1A1A1A" opacity="0.5"/>
    <rect x="17" y="26" width="3" height="4" fill="#1A1A1A" opacity="0.5"/>
    <rect x="21" y="26" width="3" height="4" fill="#1A1A1A" opacity="0.5"/>
    <rect x="17" y="33" width="3" height="4" fill="#1A1A1A" opacity="0.5"/>
