    <rect x="5.5" y="19" width="2.5" height="3" fill="#1A1A1A" opacity="0.3"/>
    <rect x="2" y="25" width="2.5" height="3" fill="#1A1A1A" opacity="0.3"/>
    <rect x="5.5" y="25" width="2.5" height="3" fill="#1A1A1A" opacity="0.3"/>
    <rect x="2" y="31" width="2.5" height="3" fill="#1A1A1A" opacity="0.3"/>
    <rect x="5.5" y="31" width="2.5" height="3" fill="#1A1A1A" opacity="0.3"/>
    <rect x="2" y="37" width="2.5" height="3" fill="#1A1A1A" opacity="0.3"/>
